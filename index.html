<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inventarisasi Aset TIK — Diskominfo Klaten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#1E1B4B;
    --navy-800:#2D2470;
    --navy-700:#4F46E5;
    --blue-500:#8B5CF6;
    --blue-100:#F0EBFF;
    --cyan:#06B6D4;
    --paper:#F3F2FA;
    --card:#FFFFFF;
    --ink:#161A2E;
    --ink-soft:#6B7086;
    --line:#E9E7F5;
    --good:#15A36A;
    --good-bg:#E1F8EC;
    --warn:#D8870D;
    --warn-bg:#FDF1DC;
    --bad:#E1473C;
    --bad-bg:#FCE7E6;
    --info:#6E56CF;
    --info-bg:#EFEAFC;
    --off:#8B90A5;
    --off-bg:#EEEDF6;
    --shadow-tint:rgba(79,70,229,.16);
  }
  *{box-sizing:border-box;}
  svg{width:16px;height:16px;}
  html{height:100%;}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  .app{display:flex;min-height:100vh;}
  #print-report{display:none;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#CFCBE8;border-radius:20px;border:2px solid var(--paper);}
  ::-webkit-scrollbar-thumb:hover{background:#B3ACD9;}

  @media (prefers-reduced-motion: no-preference){
    .fade-up{animation:fadeUp .45s cubic-bezier(.22,.9,.3,1) both;}
    .view-anim{animation:viewFade .38s cubic-bezier(.22,.9,.3,1) both;}
    .row-anim{animation:rowIn .32s ease both;}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes viewFade{from{opacity:0;transform:translateY(10px) scale(.995);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes rowIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(21,163,106,.5);}70%{box-shadow:0 0 0 6px rgba(21,163,106,0);}100%{box-shadow:0 0 0 0 rgba(21,163,106,0);}}
  @keyframes shimmerPan{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toastShrink{from{width:100%;}to{width:0%;}}
  @keyframes softFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes blobDrift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-14px,10px) scale(1.08);}}

  /* Sidebar — gradient glass, self-contained (overflow hidden) so nothing leaks past its edge */
  .sidebar{width:236px;flex-shrink:0;background:linear-gradient(165deg,var(--navy-900) 0%,#2A2570 55%,var(--navy-800) 100%);color:#fff;display:flex;flex-direction:column;padding:22px 14px;position:relative;overflow:hidden;}
  .sidebar::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;top:-90px;right:-80px;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);animation:blobDrift 10s ease-in-out infinite;pointer-events:none;}
  .sidebar::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;bottom:60px;left:-90px;background:radial-gradient(circle,rgba(6,182,212,.18),transparent 70%);pointer-events:none;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:2px 6px;position:relative;z-index:1;}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue-500),var(--navy-700));display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:14.5px;flex-shrink:0;box-shadow:0 6px 16px rgba(79,70,229,.45);transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
  .brand:hover .brand-mark{transform:rotate(-8deg) scale(1.08);}
  .brand-text{line-height:1.2;}
  .brand-text .t1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;letter-spacing:.01em;}
  .brand-text .t2{font-size:10.5px;color:#B4AEDD;margin-top:1px;}
  .nav{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#C9C4E8;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;text-align:left;width:100%;font-family:inherit;position:relative;transition:background .18s ease,color .18s ease,transform .12s ease;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav-item:hover svg{transform:translateX(1px) scale(1.08);}
  .nav-item:active{transform:scale(.97);}
  .nav-item.active{background:linear-gradient(120deg,var(--navy-700),var(--blue-500));color:#fff;box-shadow:0 8px 20px -4px rgba(79,70,229,.55);}
  .nav-item.active svg{opacity:1;}
  .nav-item .count{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:20px;transition:background .18s ease;}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:#9089BE;line-height:1.5;position:relative;z-index:1;}
  .badge-share{font-size:10.5px;color:#C9C4E8;background:rgba(255,255,255,.08);padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;margin-top:10px;}
  .badge-share .live-dot{width:6px;height:6px;border-radius:50%;background:#42D18C;flex-shrink:0;animation:pulseDot 2s infinite;}
  .logout-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#C9C4E8;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .18s ease,color .18s ease,transform .12s ease;}
  .logout-btn svg{width:14px;height:14px;}
  .logout-btn:hover{background:rgba(225,71,60,.2);color:#ffb3ae;}
  .logout-btn:active{transform:scale(.97);}

  /* Main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap;}
  .topbar h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .topbar p{margin:2px 0 0;color:var(--ink-soft);font-size:12.5px;}
  .content{padding:24px 28px;overflow:auto;}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:600;font-size:13px;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .16s ease,transform .12s ease,box-shadow .16s ease,border-color .16s ease;}
  .btn svg{width:14px;height:14px;transition:transform .2s ease;}
  .btn-primary{background:linear-gradient(120deg,var(--navy-700),var(--blue-500));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
  .btn-primary:hover{box-shadow:0 8px 20px rgba(79,70,229,.42);transform:translateY(-1px);}
  .btn-primary:hover svg{transform:rotate(90deg);}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);border-color:#CFCBE8;transform:translateY(-1px);}
  .btn-danger{background:var(--bad-bg);color:var(--bad);}
  .btn-danger:hover{background:#f9d2cf;}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Dashboard cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 19px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
  .stat-card::before{content:'';position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;background:var(--accent-glow,rgba(79,70,229,.07));transition:transform .25s ease;}
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,27,75,.10);}
  .stat-card:hover::before{transform:scale(1.15);}
  .stat-card .top-row{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .stat-card .icon-chip{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 8px rgba(30,27,75,.08);}
  .stat-card .icon-chip svg{width:17px;height:17px;}
  .stat-card .val{font-family:'Plus Jakarta Sans',sans-serif;font-size:29px;font-weight:800;margin-top:9px;position:relative;z-index:1;letter-spacing:-.01em;}
  .stat-card .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;position:relative;z-index:1;}
  .stat-card.c-total{--accent-glow:rgba(79,70,229,.09);}
  .stat-card.c-total .icon-chip{background:linear-gradient(135deg,var(--navy-700),var(--blue-500));color:#fff;}
  .stat-card.c-good{--accent-glow:rgba(21,163,106,.09);}
  .stat-card.c-good .icon-chip{background:var(--good-bg);color:var(--good);}
  .stat-card.c-warn{--accent-glow:rgba(216,135,13,.09);}
  .stat-card.c-warn .icon-chip{background:var(--warn-bg);color:var(--warn);}
  .stat-card.c-cat{--accent-glow:rgba(6,182,212,.10);}
  .stat-card.c-cat .icon-chip{background:linear-gradient(135deg,var(--cyan),var(--blue-500));color:#fff;}
  .stat-card.clickable,.value-banner.clickable{cursor:pointer;}
  .stat-card.clickable:hover{border-color:var(--navy-700);}
  .stat-card .sub svg,.vb-sub svg{width:10px;height:10px;vertical-align:-1px;margin-left:2px;opacity:.55;transition:transform .15s ease,opacity .15s ease;}
  .stat-card.clickable:hover .sub svg,.value-banner.clickable:hover .vb-sub svg{opacity:1;transform:translateX(2px);}

  /* Banner "Total Nilai Aset" */
  .value-banner{background:linear-gradient(120deg,var(--navy-900),var(--navy-700) 50%,var(--blue-500) 100%);background-size:220% 220%;animation:shimmerPan 9s ease-in-out infinite alternate;border-radius:20px;padding:24px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;box-shadow:0 16px 34px rgba(30,27,75,.24);position:relative;overflow:hidden;transition:box-shadow .25s ease;}
  .value-banner:hover{box-shadow:0 20px 42px rgba(30,27,75,.32);}
  .value-banner::before{content:'';position:absolute;inset:0;background:
      radial-gradient(circle at 85% 15%, rgba(255,255,255,.10), transparent 45%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 2px, transparent 2px 26px);}
  .value-banner::after{content:'';position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06);}
  .value-banner .vb-left{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .value-banner .vb-icon{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);animation:softFloat 3.6s ease-in-out infinite;}
  .value-banner .vb-icon svg{width:23px;height:23px;color:#fff;}
  .value-banner .vb-lbl{font-size:11.5px;color:#D8D3F5;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .value-banner .vb-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:31px;font-weight:800;color:#fff;margin-top:3px;letter-spacing:-.01em;}
  .value-banner .vb-sub{font-size:12px;color:#D8D3F5;margin-top:6px;position:relative;z-index:1;text-align:right;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:18px;transition:box-shadow .2s ease;}
  .panel:hover{box-shadow:0 8px 22px rgba(30,27,75,.06);}
  .panel h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:14.5px;margin:0 0 15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:5px;padding:5px 6px;border-radius:9px;font-size:12.5px;transition:background .15s ease;}
  .bar-row:hover{background:var(--paper);}
  .bar-row:hover .bar-fill{filter:brightness(1.08);}
  .bar-row .bar-lbl{width:148px;flex-shrink:0;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:7px;}
  .bar-row .dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 16%, transparent);}
  .bar-track{flex:1;height:9px;background:var(--paper);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(30,27,75,.06);}
  .bar-fill{height:100%;border-radius:5px;background:var(--blue-500);transition:width .6s cubic-bezier(.22,.9,.3,1),filter .15s ease;}
  .bar-row .bar-n{width:28px;text-align:center;font-weight:700;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;background:var(--paper);border-radius:20px;padding:2px 0;}

  /* Daftar "Aset per Kategori" — baris horizontal terstruktur: ikon berwarna khas
     kategori, nama, track proporsional terhadap kategori terbesar, lalu pill jumlah.
     Menggantikan bar-chart vertikal lama yang terasa acak & sulit dibandingkan
     ketika jumlah antar-kategori kecil/sama. */
  .kat-list{display:flex;flex-direction:column;gap:4px;}
  .kat-row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:12px;transition:background .15s ease,transform .15s ease;}
  .kat-row:hover{background:var(--paper);transform:translateX(2px);}
  .kat-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;box-shadow:0 3px 8px -2px rgba(30,27,75,.25);}
  .kat-icon svg{width:15px;height:15px;}
  .kat-body{flex:1;min-width:0;}
  .kat-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .kat-name{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kat-count{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:12.5px;flex-shrink:0;letter-spacing:-.01em;}
  .kat-track{height:7px;background:var(--paper);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(30,27,75,.06);}
  .kat-fill{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.22,.9,.3,1),filter .15s ease;}
  .kat-row:hover .kat-fill{filter:brightness(1.08) saturate(1.1);}
  .panel-meta{font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);padding:4px 10px;border-radius:20px;flex-shrink:0;}

  /* Kartu status "Aset per Status" — pengganti daftar baris polos, memakai palet semantik dashboard (good/warn/bad/off) yang sama dengan kartu ringkasan di atas, dengan bar proporsi tipis di bawah nama supaya lebih mudah dibandingkan sekilas */
  .status-list{display:flex;flex-direction:column;gap:6px;flex:1;min-width:230px;}
  .status-row{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;background:var(--paper);transition:background .15s ease,transform .15s ease;cursor:pointer;}
  .status-row:hover{background:color-mix(in srgb, currentColor 8%, var(--paper));transform:translateX(2px);}
  .sr-icon{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb, currentColor 15%, white);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:currentColor;}
  .sr-icon svg{width:15px;height:15px;color:currentColor;}
  .sr-body{flex:1;min-width:0;}
  .sr-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .sr-name{font-weight:700;font-size:12.5px;color:var(--ink);line-height:1.25;}
  .sr-count{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .sr-pct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;color:currentColor;flex-shrink:0;letter-spacing:-.01em;}
  .sr-track{height:5px;background:color-mix(in srgb, currentColor 14%, white);border-radius:4px;overflow:hidden;margin-top:6px;}
  .sr-track-fill{height:100%;border-radius:4px;background:currentColor;transition:width .7s cubic-bezier(.22,.9,.3,1);}
  .donut-halo{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle, rgba(30,27,75,.05), transparent 70%);z-index:0;}

  /* Panel gabungan "Ringkasan Aset" — Kategori & Status dalam satu kartu, dipisah garis pembatas */
  .ringkasan-grid{display:grid;grid-template-columns:1fr 1px 1fr;gap:24px;align-items:start;}
  .ringkasan-divider{background:var(--line);align-self:stretch;}
  .ringkasan-col{min-width:0;}
  .rk-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:14px;}
  @media (max-width:900px){
    .ringkasan-grid{grid-template-columns:1fr;gap:22px;}
    .ringkasan-divider{width:100%;height:1px;}
  }

  .two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}

  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut-svg{width:100%;height:100%;flex-shrink:0;}
  .donut-svg circle{transition:stroke-width .15s ease;}
  .donut-svg .donut-seg{transition:filter .15s ease,transform .15s ease;transform-box:fill-box;transform-origin:center;cursor:pointer;}
  .donut-svg .donut-seg:hover{filter:brightness(1.1) saturate(1.1) !important;transform:scale(1.03);}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .donut-center::before{content:'';position:absolute;width:64%;height:64%;border-radius:50%;background:#fff;box-shadow:inset 0 1px 3px rgba(30,27,75,.05),0 2px 8px rgba(30,27,75,.06);z-index:-1;}
  .donut-center .n{font-family:'Plus Jakarta Sans',sans-serif;font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1;}
  .donut-center .t{font-size:9px;color:var(--ink-soft);letter-spacing:.08em;font-weight:700;margin-top:3px;}
  .legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:190px;}
  .legend-item{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:6px 8px;border-radius:9px;transition:background .15s ease;}
  .legend-item:hover{background:var(--paper);}
  .legend-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 15%, transparent);}
  .legend-item .name{flex:1;color:var(--ink);font-weight:500;}
  .legend-item .n{font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;}
  .legend-item .pct{font-size:10.5px;color:var(--ink-soft);font-weight:600;background:var(--paper);border-radius:20px;padding:2px 7px;margin-left:2px;}

  /* Status diagram — daftar status dengan bar persentase, dipakai di panel "Aset per Status" */
  .status-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;margin-bottom:6px;position:relative;overflow:hidden;background:var(--paper);transition:transform .15s ease;}
  .status-row:hover{transform:translateX(2px);}
  .status-row:last-child{margin-bottom:0;}
  .status-row .sr-fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px;opacity:.16;z-index:0;transition:width .7s cubic-bezier(.22,.9,.3,1);}
  .status-row .sr-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;position:relative;z-index:1;box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);}
  .status-row .sr-body{flex:1;min-width:0;position:relative;z-index:1;}
  .status-row .sr-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .status-row .sr-name{font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-row .sr-pct{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em;flex-shrink:0;}

<script>
// Shim window.storage supaya kode di bawah (yang aslinya ditulis untuk
// lingkungan Claude Artifacts) bisa jalan di deployment Vercel biasa.
// Interface-nya sengaja dibuat sama persis (get/set mengembalikan
// {key, value, shared} atau null) supaya logic loadData()/persist() di
// bawah tidak perlu diubah sama sekali.
function redirectIfLoggedOut(res){
  // Kalau sesi login sudah habis, middleware di server akan mengalihkan
  // permintaan API ini ke halaman login (isinya HTML, bukan JSON). Deteksi
  // itu di sini supaya pengguna diarahkan balik ke /login.html dengan rapi,
  // bukan melihat error "Gagal mengambil/menyimpan data" yang membingungkan.
  const ct = res.headers.get('content-type') || '';
  if(res.redirected || ct.includes('text/html')){
    window.location.href = '/login.html';
    return true;
  }
  return false;
}
window.storage = {
  async get(key){
    const res = await fetch('/api/storage?key=' + encodeURIComponent(key));
    if(redirectIfLoggedOut(res)) return await new Promise(()=>{});
    if(res.status === 404) return null;
    if(!res.ok) throw new Error('Gagal mengambil data dari server');
    return await res.json();
  },
  async set(key, value){
    const res = await fetch('/api/storage', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key, value})
    });
    if(redirectIfLoggedOut(res)) return await new Promise(()=>{});
    if(!res.ok) throw new Error('Gagal menyimpan data ke server');
    return await res.json();
  }
};
async function logout(){
  try{ await fetch('/api/logout', {method:'POST'}); }catch(e){}
  window.location.href = '/login.html';
}

const STATUS_CFG = {
  'Baik': {color:'good', hex:'#15A36A', icon:'check'},
  'Rusak Ringan': {color:'warn', hex:'#D8870D', icon:'alert'},
  'Rusak Berat': {color:'bad', hex:'#E1473C', icon:'x'},
  'Dalam Perbaikan': {color:'info', hex:'#6E56CF', icon:'wrench'},
  'Tidak Digunakan': {color:'off', hex:'#8B90A5', icon:'ban'},
};
const KATEGORI_LIST = ['Komputer/PC','Laptop','Printer/Scanner','Server','Perangkat Jaringan','Proyektor','UPS','Lainnya'];
const KATEGORI_COLOR = {
  'Komputer/PC':'#3B7DBF','Laptop':'#6E56CF','Printer/Scanner':'#D98C2B','Server':'#C4453D',
  'Perangkat Jaringan':'#2F9E6E','Proyektor':'#0F8B8D','UPS':'#B8860B','Lainnya':'#8A93A6',
};
const KATEGORI_ICON = {
  'Komputer/PC':'monitor','Laptop':'laptop','Printer/Scanner':'printer','Server':'server',
  'Perangkat Jaringan':'network','Proyektor':'projector','UPS':'battery','Lainnya':'grid',
};
const STORAGE_KEY = 'aset_tik_diskominfo_klaten_v2';

let state = {
  assets: [],
  loaded: false,
  view: 'dashboard',
  search: '',
  filterKategori: 'Semua',
  filterStatus: 'Semua',
  filterLokasi: 'Semua',
  activitySearch: '',

};

function uid(){ return 'a' + Math.random().toString(36).slice(2,10); }
// nowISO() adalah SATU-SATUNYA sumber waktu yang disimpan untuk setiap entri riwayat
// (bentuk ISO yang bisa diurutkan tepat). now()/today() hanya untuk TAMPILAN, tidak
// pernah lagi disimpan langsung ke field tanggal riwayat — sebelumnya percampuran
// format inilah yang membuat "Aktivitas Terbaru" tidak ikut naik ke atas saat
// aset diedit/ditambah (urutannya kacau karena membandingkan dua format teks berbeda).
function nowISO(){ return new Date().toISOString(); }
function now(){ return new Date().toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtWaktu(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso || '-';
  return d.toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtRupiah(n){
  const v = Number(n)||0;
  if(!v) return '-';
  return 'Rp' + v.toLocaleString('id-ID');
}
function activityMeta(aksi){
  const a = String(aksi||'');
  if(a==='Ditambahkan') return {icon:'plus', fg:'var(--good)', bg:'var(--good-bg)'};
  if(a.startsWith('Status diubah')) return {icon:'alert', fg:'var(--warn)', bg:'var(--warn-bg)'};
  if(a==='Diimpor') return {icon:'upload', fg:'var(--navy-700)', bg:'var(--blue-100)'};
  return {icon:'edit', fg:'var(--blue-500)', bg:'var(--blue-100)'};
}

function nextKode(){
  const nums = state.assets.map(a=>{
    const m = /TIK-(\d+)/.exec(a.kode||'');
    return m ? parseInt(m[1],10) : 0;
  });
  const n = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'TIK-' + String(n).padStart(4,'0');
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      state.assets = JSON.parse(res.value);
    }else{
      state.assets = seedData();
      await persist();
    }
  }catch(e){
    state.assets = seedData();
  }
  // Perbaikan sekali-jalan: versi lama sistem ini sempat menyimpan sebagian
  // stempel waktu riwayat yang "kepeleset" ke masa depan, sehingga aktivitas
  // baru yang Anda buat tidak pernah bisa naik melewatinya di daftar urutan.
  // Di sini kita deteksi dan betulkan otomatis, lalu simpan ulang.
  const repaired = repairFutureTimestamps();
  state.loaded = true;
  render();
  if(repaired) await persist();
}

function repairFutureTimestamps(){
  const nowMs = Date.now();
  const future = [];
  state.assets.forEach(a=>{
    (a.riwayat||[]).forEach(r=>{
      const t = new Date(r.tanggal).getTime();
      if(!isNaN(t) && t > nowMs) future.push(r);
    });
  });
  if(!future.length) return false;
  // Urutkan sesuai waktu aslinya (menjaga urutan relatif antar-entri), lalu
  // geser semuanya ke detik-detik terakhir sebelum sekarang.
  future.sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal));
  future.forEach((r,i)=>{
    r.tanggal = new Date(nowMs - (future.length-i)*1000).toISOString();
  });
  return true;
}

async function persist(){
  // Coba simpan hingga 3x (dengan jeda) sebelum menyerah — banyak "gagal
  // menyimpan" sebelumnya sebenarnya cuma gangguan koneksi sesaat, bukan
  // kegagalan permanen.
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(state.assets), true);
      if(res) return true;
    }catch(e){
      console.error('Gagal menyimpan (percobaan '+attempt+'):', e);
    }
    if(attempt<3) await new Promise(r=>setTimeout(r, 600*attempt));
  }
  showToast('Gagal menyimpan ke penyimpanan bersama. Data masih tampil di layar ini — coba muat ulang halaman, lalu ulangi perubahan jika perlu.', 'error');
  return false;
}

function seedData(){

  const mk = (aksi) => [{tanggal:ts(), aksi, catatan:'Data awal sistem'}];
  return [
    {id:uid(),kode:'TIK-0001',nama:'PC Operator Layanan',kategori:'Komputer/PC',merk:'Dell OptiPlex 3090',noSeri:'DL3090-9921',tahun:'2023',lokasi:'Ruang Pelayanan Publik',penanggungJawab:'Bagian Layanan Informasi',status:'Baik',keterangan:'',hargaPerolehan:9500000,tanggal:t,riwayat:mk('Ditambahkan')},
    {id:uid(),kode:'TIK-0002',nama:'Laptop Kabid Aptika',kategori:'Laptop',merk:'Lenovo ThinkPad E14',noSeri:'LNV-E14-4471',tahun:'2022',lokasi:'Bidang Aptika',penanggungJawab:'Kabid Aptika',status:'Baik',keterangan:'',hargaPerolehan:12500000,tanggal:t,riwayat:mk('Ditambahkan')},
    {id:uid(),kode:'TIK-0003',nama:'Server Data Center Diskominfo',kategori:'Server',merk:'HPE ProLiant DL380',noSeri:'HPE-DL380-2201',tahun:'2021',lokasi:'Ruang Server',penanggungJawab:'Bidang Infrastruktur',status:'Baik',keterangan:'Perlu upgrade RAM tahun depan',hargaPerolehan:85000000,tanggal:t,riwayat:mk('Ditambahkan')},
    {id:uid(),kode:'TIK-0004',nama:'Printer Loket Persuratan',kategori:'Printer/Scanner',merk:'Canon iR2625',noSeri:'CN-IR2625-0087',tahun:'2020',lokasi:'Ruang Persuratan',penanggungJawab:'Sekretariat',status:'Rusak Ringan',keterangan:'Roller macet, menunggu spare part',hargaPerolehan:18000000,tanggal:t,riwayat:[{tanggal:ts(),aksi:'Ditambahkan',catatan:'Data awal sistem'},{tanggal:ts(),aksi:'Status diubah',catatan:'Baik → Rusak Ringan'}]},

function computeStats(){
  const total = state.assets.length;
  const byStatus = {};
  const byKategori = {};
  state.assets.forEach(a=>{
    byStatus[a.status] = (byStatus[a.status]||0)+1;
    byKategori[a.kategori] = (byKategori[a.kategori]||0)+1;
  });
  const baik = byStatus['Baik']||0;
  const perluPerhatian = total - baik;
  const totalNilai = state.assets.reduce((sum,a)=> sum + (Number(a.hargaPerolehan)||0), 0);
  return {total, byStatus, byKategori, baik, perluPerhatian, totalNilai};
}

function statusPill(status){
  const cfg = STATUS_CFG[status] || {color:'off'};
  return `<span class="status-pill" style="background:var(--${cfg.color}-bg);color:var(--${cfg.color})">
    <span class="dot" style="background:var(--${cfg.color})"></span>${status}</span>`;
}

function knownLokasi(){
  const set = new Set();
  state.assets.forEach(a=>{ if(a.lokasi && a.lokasi.trim()) set.add(a.lokasi.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}

function filteredAssets(){
  return state.assets.filter(a=>{
    const q = state.search.trim().toLowerCase();
    const matchQ = !q || [a.nama,a.kode,a.merk,a.noSeri,a.lokasi,a.penanggungJawab].join(' ').toLowerCase().includes(q);
    const matchK = state.filterKategori==='Semua' || a.kategori===state.filterKategori;
    const matchS = state.filterStatus==='Semua' ? true
      : state.filterStatus==='Perlu Perhatian' ? a.status!=='Baik'
      : a.status===state.filterStatus;
    const matchL = state.filterLokasi==='Semua' || a.lokasi===state.filterLokasi;
    return matchQ && matchK && matchS && matchL;
  });
}

function sortedAssets(list){
  if(!state.sortKey) return list;
  const dir = state.sortDir==='asc' ? 1 : -1;
  return [...list].sort((a,b)=> String(a[state.sortKey]||'').localeCompare(String(b[state.sortKey]||'')) * dir);
}

function toggleSort(key){
  if(state.sortKey===key){
    state.sortDir = state.sortDir==='asc' ? 'desc' : 'asc';
  }else{
    state.sortKey = key;
    state.sortDir = 'asc';
  }
  render();
}

function csvEscape(v){ return `"${String(v||'').replace(/"/g,'""')}"`; }

function exportCSV(){
  const rows = [['Kode','Nama','Kategori','Merk','NoSeri','Tahun','Lokasi','PenanggungJawab','Status','HargaPerolehan','Keterangan']];
  sortedAssets(filteredAssets()).forEach(a=>{
    rows.push([a.kode,a.nama,a.kategori,a.merk,a.noSeri,a.tahun,a.lokasi,a.penanggungJawab,a.status,a.hargaPerolehan||0,a.keterangan]);
  });
  // Baris "sep=," di awal file memaksa Excel memakai koma sebagai pemisah kolom
  // saat file dibuka langsung (double-click) — tanpa ini, Excel di komputer
  // berbahasa Indonesia memakai titik koma sesuai region, sehingga semua data
  // masuk ke satu kolom (terlihat "acak-acakan").
  const csv = 'sep=,\n' + rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'daftar-aset-tik-diskominfo-klaten.csv';
  link.click();
  URL.revokeObjectURL(url);
}

function parseCSVLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ out.push(cur); cur=''; }
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}

function triggerImport(){ document.getElementById('csv-input').click(); }

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const text = reader.result.replace(/^\ufeff/, '');
      let lines = text.split(/\r?\n/).filter(l=>l.trim().length);
      if(lines[0] && /^sep=.$/i.test(lines[0].trim())) lines = lines.slice(1);
      if(lines.length < 2){ showToast('File CSV kosong atau tidak valid.', 'error'); return; }
      const header = parseCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
      const idx = (name) => header.indexOf(name);
      let added = 0;
      for(let i=1;i<lines.length;i++){
        const cols = parseCSVLine(lines[i]);
        const nama = idx('nama')>=0 ? cols[idx('nama')] : '';
        if(!nama) continue;
        const asset = {
          id: uid(),
          kode: nextKodeForImport(),
          nama,
          kategori: (idx('kategori')>=0 && KATEGORI_LIST.includes(cols[idx('kategori')])) ? cols[idx('kategori')] : 'Lainnya',
          merk: idx('merk')>=0 ? cols[idx('merk')] : '',
          noSeri: idx('noseri')>=0 ? cols[idx('noseri')] : '',
          tahun: idx('tahun')>=0 ? cols[idx('tahun')] : '',
          lokasi: idx('lokasi')>=0 ? cols[idx('lokasi')] : '',
          penanggungJawab: idx('penanggungjawab')>=0 ? cols[idx('penanggungjawab')] : '',
          status: (idx('status')>=0 && STATUS_CFG[cols[idx('status')]]) ? cols[idx('status')] : 'Baik',
          keterangan: idx('keterangan')>=0 ? cols[idx('keterangan')] : '',
          hargaPerolehan: idx('hargaperolehan')>=0 ? (parseInt(String(cols[idx('hargaperolehan')]).replace(/[^0-9]/g,''),10)||0) : 0,
          tanggal: today(),
          riwayat: [{tanggal:nowISO(), aksi:'Diimpor', catatan:'Data diimpor dari berkas CSV'}],
        };
        state.assets.unshift(asset);
        added++;
      }
      showToast(added ? `${added} aset berhasil diimpor` : 'Tidak ada baris valid untuk diimpor', added ? 'success' : 'error');
      render();
      if(added) await persist();
    }catch(err){
      showToast('Gagal membaca berkas CSV.', 'error');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}
function nextKodeForImport(){
  const kode = nextKode();
  // bump a temp asset placeholder isn't added yet; recompute after each push naturally since nextKode reads state.assets live
  return kode;
}

function findDuplicateNoSeri(noSeri, excludeId){
  const q = String(noSeri||'').trim().toLowerCase();
  if(!q) return null;
  return state.assets.find(a=>a.id!==excludeId && String(a.noSeri||'').trim().toLowerCase()===q) || null;
}

async function saveModal(e){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const prev = state.modal.data;
  const data = { ...prev };
  // NOTE: 'kode' is intentionally NOT read from the form — it is system-generated
  // and must never be overwritten by a missing/blank form field.
  ['nama','kategori','merk','noSeri','tahun','lokasi','penanggungJawab','status','keterangan'].forEach(k=>{
    data[k] = fd.get(k) || '';
  });
  data.hargaPerolehan = parseInt(String(fd.get('hargaPerolehan')||'').replace(/[^0-9]/g,''),10) || 0;

  if(!String(data.nama).trim()){
    showToast('Nama aset wajib diisi.', 'error');
    return;
  }
  const dupe = findDuplicateNoSeri(data.noSeri, state.modal.mode==='edit' ? data.id : null);
  if(dupe){
    showToast(`Nomor seri sudah dipakai oleh "${dupe.nama}" (${dupe.kode}).`, 'error');
    return;
  }

  if(state.modal.mode==='add'){
    data.riwayat = [{tanggal:nowISO(), aksi:'Ditambahkan', catatan:'Aset baru dicatat ke sistem'}];
    state.assets.unshift(data);
  }else{
    const riwayat = Array.isArray(prev.riwayat) ? [...prev.riwayat] : [];
    if(prev.status !== data.status){
      riwayat.unshift({tanggal:nowISO(), aksi:'Status diubah', catatan:`${prev.status} → ${data.status}`});
    }else{
      riwayat.unshift({tanggal:nowISO(), aksi:'Diubah', catatan:'Detail data aset diperbarui'});
    }
    data.riwayat = riwayat;
    const idx = state.assets.findIndex(x=>x.id===data.id);
    state.assets[idx] = data;
  }
  const isAdd = state.modal.mode==='add';
  state.modal = null;
  render();
  const ok = await persist();
  if(ok) showToast(isAdd ? 'Aset baru berhasil ditambahkan' : 'Perubahan aset disimpan');
}

async function confirmDeleteFn(){
  state.assets = state.assets.filter(a=>a.id!==state.confirmDelete);
  state.selectedIds.delete(state.confirmDelete);
  if(state.detailId===state.confirmDelete) state.detailId=null;
  state.confirmDelete = null;
  render();
  const ok = await persist();
  if(ok) showToast('Aset dihapus');
}
function cancelDelete(){ state.confirmDelete=null; render(); }

function toggleSelect(id){
  if(state.selectedIds.has(id)) state.selectedIds.delete(id);
  else state.selectedIds.add(id);
  render();
}
function toggleSelectAll(list){
  const allSelected = list.every(a=>state.selectedIds.has(a.id)) && list.length>0;
  if(allSelected) list.forEach(a=>state.selectedIds.delete(a.id));
  else list.forEach(a=>state.selectedIds.add(a.id));
  render();
}
function clearSelection(){ state.selectedIds.clear(); render(); }
function askBulkDelete(){ state.confirmBulkDelete = true; render(); }
async function confirmBulkDeleteFn(){
  state.assets = state.assets.filter(a=>!state.selectedIds.has(a.id));
  const n = state.selectedIds.size;
  state.selectedIds.clear();
  state.confirmBulkDelete = false;
  render();
  const ok = await persist();
  if(ok) showToast(`${n} aset terpilih berhasil dihapus`);
}
function cancelBulkDelete(){ state.confirmBulkDelete=false; render(); }

async function bulkSetStatus(status){
  if(!status) return;
  const n = state.selectedIds.size;
  state.assets = state.assets.map(a=>{
    if(!state.selectedIds.has(a.id)) return a;
    if(a.status===status) return a;
    const riwayat = Array.isArray(a.riwayat) ? [...a.riwayat] : [];
    riwayat.unshift({tanggal:nowISO(), aksi:'Status diubah', catatan:`${a.status} → ${status} (massal)`});
    return {...a, status, riwayat};
  });
  render();
  const ok = await persist();
  if(ok) showToast(`Status ${n} aset diperbarui`);
}

function shadeColor(hex, percent){
  // percent negatif = gelapkan (untuk sisi/bayangan 3D), positif = terangkan
  const f = parseInt(hex.slice(1), 16), t = percent < 0 ? 0 : 255, p = Math.abs(percent);
  const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
  return '#' + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
}

function svgDonut(byStatus, total, w, h){
  // Ring chart flat & profesional: strip ramping, ujung membulat (rounded cap),
  // "track" abu-abu tipis sebagai dasar, gradasi sangat halus (nyaris flat, bukan
  // efek glossy/3D) supaya terasa rapi dan tidak seperti "gelembung".
  w = w || 240; h = h || 240;
  const cx = w / 2, cy = h / 2;
  const strokeW = Math.min(w, h) * 0.108;
  const R = Math.min(w, h) / 2 - strokeW / 2 - 6;
  const toRad = d => (d - 90) * Math.PI / 180;
  const pt = (deg, r) => [cx + r * Math.cos(toRad(deg)), cy + r * Math.sin(toRad(deg))];

  const entries = Object.entries(byStatus).filter(([,v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const n = entries.length;
  const gapDeg = n > 1 ? 6 : 0;
  const usable = 360 - gapDeg * n;

  let angle = 0;
  const segs = [], defs = [];
  const shadowId = 'donutRingShadow';
  defs.push(`<filter id="${shadowId}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>`);

  entries.forEach(([k, v], i) => {
    const hex = (STATUS_CFG[k] || {}).hex || '#8A93A6';
    const frac = total ? v / total : 0;
    if(frac <= 0) return;
    const sweep = frac * usable;
    const a0 = angle, a1 = angle + sweep;
    angle = a1 + gapDeg;
    const pct = Math.round(frac * 100);
    const large = sweep > 180 ? 1 : 0;

    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const gradId = `dseg-${i}`;

    defs.push(`<linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${shadeColor(hex, 0.08)}"/>
      <stop offset="100%" stop-color="${shadeColor(hex, -0.04)}"/>
    </linearGradient>`);

    segs.push(`<path class="donut-seg" d="M ${x0} ${y0} A ${R} ${R} 0 ${large} 1 ${x1} ${y1}" fill="none" stroke="url(#${gradId})" stroke-width="${strokeW}" stroke-linecap="round" filter="url(#${shadowId})"><title>${k}: ${pct}% (${v} aset)</title></path>`);
  });

  return `<svg class="donut-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs>${defs.join('')}</defs>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#F0EEF7" stroke-width="${strokeW}"/>
    ${segs.join('')}
  </svg>`;
}

function allActivity(){
  const items = [];
  state.assets.forEach(a=>{
    (a.riwayat||[]).forEach(r=>{
      items.push({...r, assetId:a.id, aset:a.nama, kode:a.kode});
    });
  });
  // Urutkan berdasarkan waktu SESUNGGUHNYA (Date), bukan perbandingan string —
  // ini yang tadinya bikin aktivitas baru tidak naik ke atas.
  items.sort((a,b)=> new Date(b.tanggal) - new Date(a.tanggal));
  return items;
}
function recentActivity(){
  return allActivity().slice(0,6);
}

      <div class="empty-state">${icon('box')}<div>Tidak ada aset yang cocok dengan pencarian/filter.</div></div>`}
    </div>
  </div>`;
}

function activityAksiList(){
  const set = new Set();
  state.assets.forEach(a=> (a.riwayat||[]).forEach(r=> r.aksi && set.add(r.aksi)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}

function filteredActivity(){
  const q = state.activitySearch.trim().toLowerCase();
  return allActivity().filter(item=>{
    const matchQ = !q || [item.aset,item.kode,item.aksi,item.catatan].join(' ').toLowerCase().includes(q);
    const matchA = state.activityFilterAksi==='Semua' || item.aksi===state.activityFilterAksi;
    return matchQ && matchA;
  });
}

function onActivitySearchInput(val){ state.activitySearch = val; render(); }

function renderAktivitas(){
  const items = filteredActivity();
  return `
  <div class="topbar">
    <div><h1>Riwayat Aktivitas</h1><p>Seluruh riwayat penambahan, perubahan, dan impor aset — selalu terbarui otomatis</p></div>
  </div>
  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        ${icon('search')}
        <input id="activity-search-input" placeholder="Cari nama aset, kode, aksi, catatan..." value="${escapeAttr(state.activitySearch)}" oninput="onActivitySearchInput(this.value)">
      </div>
      <select class="filter" onchange="state.activityFilterAksi=this.value; render()">
        <option ${state.activityFilterAksi==='Semua'?'selected':''}>Semua</option>
        ${activityAksiList().map(k=>`<option ${state.activityFilterAksi===k?'selected':''}>${k}</option>`).join('')}
      </select>
    </div>
    <div class="panel">
      <h2>${items.length} aktivitas ditemukan</h2>
      ${items.length ? items.map(item=>`
        <div class="activity-item" style="cursor:pointer;" onclick="openDetail('${item.assetId}')">
          <div class="activity-badge" style="background:${activityMeta(item.aksi).bg};color:${activityMeta(item.aksi).fg};">${icon(activityMeta(item.aksi).icon)}</div>
          <div>
            <div class="a-main"><strong>${item.aksi}</strong> &middot; ${item.aset} <span class="tag-code" style="margin-left:4px;">${item.kode}</span></div>
            <div class="a-sub">${item.catatan||''} &middot; ${fmtWaktu(item.tanggal)}</div>
          </div>
        </div>`).join('') : '<p style="color:var(--ink-soft);font-size:13px;">Tidak ada aktivitas yang cocok.</p>'}
    </div>
  </div>`;
}

function renderModal(){
  if(!state.modal) return '';
  const d = state.modal.data;
  const isEdit = state.modal.mode==='edit';
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h3>${isEdit?'Ubah Data Aset':'Tambah Aset Baru'} <span class="tag-code">${d.kode}</span></h3>
      <p class="modal-sub">Kode aset dibangkitkan otomatis oleh sistem dan tidak dapat diubah.</p>
      <form onsubmit="saveModal(event)">
        <div class="form-grid">
          <div class="form-field full"><label>Nama Aset</label><input name="nama" required value="${escapeAttr(d.nama)}" placeholder="mis. Laptop Bidang Aptika"></div>
          <div class="form-field"><label>Kategori</label>
            <select name="kategori">${KATEGORI_LIST.map(k=>`<option ${d.kategori===k?'selected':''}>${k}</option>`).join('')}</select>
          </div>
          <div class="form-field"><label>Status</label>
            <select name="status">${Object.keys(STATUS_CFG).map(k=>`<option ${d.status===k?'selected':''}>${k}</option>`).join('')}</select>
          </div>
          <div class="form-field"><label>Merk / Model</label><input name="merk" value="${escapeAttr(d.merk)}" placeholder="mis. Dell OptiPlex 3090"></div>
          <div class="form-field"><label>Nomor Seri</label><input name="noSeri" value="${escapeAttr(d.noSeri)}"></div>
          <div class="form-field"><label>Tahun Perolehan</label><input name="tahun" value="${escapeAttr(d.tahun)}" placeholder="2024"></div>
          <div class="form-field"><label>Nilai Perolehan (Rp)</label><input name="hargaPerolehan" inputmode="numeric" value="${escapeAttr(d.hargaPerolehan||'')}" placeholder="mis. 12500000"></div>
          <div class="form-field"><label>Lokasi / Ruangan</label><input name="lokasi" value="${escapeAttr(d.lokasi)}" placeholder="mis. Bidang Infrastruktur"></div>
          <div class="form-field full"><label>Penanggung Jawab</label><input name="penanggungJawab" value="${escapeAttr(d.penanggungJawab)}"></div>
          <div class="form-field full"><label>Keterangan</label><textarea name="keterangan" placeholder="Catatan kondisi, riwayat perbaikan, dsb.">${d.keterangan||''}</textarea></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn btn-primary">${isEdit?'Simpan Perubahan':'Tambah Aset'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

function renderDetail(){
  if(!state.detailId) return '';
  const a = state.assets.find(x=>x.id===state.detailId);
  if(!a) return '';
  return `
  <div class="overlay" onclick="if(event.target===this) closeDetail()">
    <div class="modal wide">
      <div class="detail-head">
        <div>
          <h3>${a.nama}</h3>
          <p class="modal-sub" style="margin:2px 0 0;">
            <span class="tag-code">${a.kode}</span> &middot; ${statusPill(a.status)}
          </p>
        </div>
        <button class="icon-btn" onclick="closeDetail()">${icon('x')}</button>
      </div>
      <div class="detail-grid">
        <div><div class="di-lbl">Kategori</div><div class="di-val"><span class="cat-dot" style="background:${KATEGORI_COLOR[a.kategori]||'#8A93A6'};margin-right:6px;"></span>${a.kategori}</div></div>
        <div><div class="di-lbl">Tahun Perolehan</div><div class="di-val">${a.tahun||'-'}</div></div>
        <div><div class="di-lbl">Nilai Perolehan</div><div class="di-val">${fmtRupiah(a.hargaPerolehan)}</div></div>
        <div><div class="di-lbl">Merk / Model</div><div class="di-val">${a.merk||'-'}</div></div>
        <div><div class="di-lbl">Nomor Seri</div><div class="di-val">${a.noSeri||'-'}</div></div>
        <div><div class="di-lbl">Lokasi</div><div class="di-val">${a.lokasi||'-'}</div></div>
        <div><div class="di-lbl">Penanggung Jawab</div><div class="di-val">${a.penanggungJawab||'-'}</div></div>
        <div class="full"><div class="di-lbl">Keterangan</div><div class="di-val">${a.keterangan||'Tidak ada catatan.'}</div></div>
      </div>
      <div class="timeline">
        <h2 style="font-family:'Space Grotesk',sans-serif;font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:6px;"><span style="width:16px;height:16px;display:inline-flex;">${icon('clock')}</span> Riwayat Aktivitas</h2>
        ${(a.riwayat&&a.riwayat.length) ? a.riwayat.map(r=>`
          <div class="timeline-item">
            <div class="timeline-badge" style="background:${activityMeta(r.aksi).bg};color:${activityMeta(r.aksi).fg};">${icon(activityMeta(r.aksi).icon)}</div>
            <div><div class="ti-main"><strong>${r.aksi}</strong> — ${r.catatan||''}</div><div class="ti-sub">${fmtWaktu(r.tanggal)}</div></div>
          </div>`).join('') : '<p style="color:var(--ink-soft);font-size:12.5px;">Belum ada riwayat.</p>'}
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="askDelete('${a.id}')">${icon('trash')}Hapus</button>
        <button class="btn btn-ghost" onclick="closeDetail()">Tutup</button>
        <button class="btn btn-primary" onclick="closeDetail(); openEditModal('${a.id}')">${icon('edit')}Ubah Data</button>
      </div>
    </div>
  </div>`;
}

function renderConfirmDelete(){
  if(!state.confirmDelete) return '';
  const a = state.assets.find(x=>x.id===state.confirmDelete);
  return `
  <div class="overlay" onclick="if(event.target===this) cancelDelete()">
    <div class="modal" style="max-width:400px;">
      <h3>Hapus aset ini?</h3>
      <p class="modal-sub">"${a?a.nama:''}" (${a?a.kode:''}) akan dihapus permanen dari sistem.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="cancelDelete()">Batal</button>
        <button class="btn btn-danger" onclick="confirmDeleteFn()">${icon('trash')}Hapus</button>
      </div>
    </div>
  </div>`;
}

function renderConfirmBulkDelete(){
  if(!state.confirmBulkDelete) return '';
  return `
  <div class="overlay" onclick="if(event.target===this) cancelBulkDelete()">
    <div class="modal" style="max-width:400px;">
      <h3>Hapus ${state.selectedIds.size} aset terpilih?</h3>
      <p class="modal-sub">Tindakan ini akan menghapus seluruh aset yang dipilih secara permanen.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="cancelBulkDelete()">Batal</button>
        <button class="btn btn-danger" onclick="confirmBulkDeleteFn()">${icon('trash')}Hapus Semua</button>
      </div>
    </div>
  </div>`;
}

function escapeAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

function animateCountUps(){
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const target = Number(el.getAttribute('data-countup')) || 0;
    const isRupiah = el.hasAttribute('data-countup-rupiah');
    const dur = 700;
    const t0 = performance.now();
    function frame(t){
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      const val = Math.round(target * eased);
      el.textContent = isRupiah ? fmtRupiah(val) : val.toLocaleString('id-ID');
      if(p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

// Hanya dipakai untuk memicu animasi masuk yang lebih terasa saat BERPINDAH
// menu (dashboard/daftar/aktivitas) — sengaja TIDAK dipicu pada render biasa
// (mis. saat mengetik di kotak pencarian) supaya tidak berkedip-kedip.
let lastRenderedView = null;

function renderApp(){
  const root = document.getElementById('root');

  // Preserve focus + caret position across full re-renders (fixes the
  // previous bug where typing in the search box lost focus every keystroke).
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==='number') ? active.selectionEnd : null;

  if(!state.loaded){
    root.innerHTML = `<div class="loading-screen"><div class="spinner"></div><div class="lt">Memuat data aset...</div></div>`;
    return;
  }

  const viewChanged = lastRenderedView !== state.view;
  lastRenderedView = state.view;

  root.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      <div ${viewChanged ? 'class="view-anim"' : ''}>
      ${state.view==='dashboard' ? renderDashboard() : state.view==='aktivitas' ? renderAktivitas() : state.view==='kategori' ? renderKategori() : state.view==='nilai' ? renderNilai() : renderDaftar()}
      </div>
    </div>
    ${renderModal()}
    ${renderDetail()}
    ${renderConfirmDelete()}
    ${renderConfirmBulkDelete()}
    ${state.toast ? `<div class="toast ${state.toast.type==='error'?'toast-error':''}"><div class="toast-row">${icon(state.toast.type==='error'?'alert':'check')}${state.toast.msg}</div><div class="toast-bar"></div></div>` : ''}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(state.view==='dashboard' || state.view==='nilai') animateCountUps();
}
function render(){ renderApp(); }

loadData();
</script>
