<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Inventarisasi Aset TIK Diskominfo Klaten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0F2340;
    --navy-800:#152F52;
    --navy-700:#1E4976;
    --blue-500:#3B7DBF;
    --blue-100:#E4EEF8;
    --ink:#1A2433;
    --ink-soft:#5B6678;
    --line:#E1E6ED;
    --bad:#C4453D;
    --bad-bg:#FBE9E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;font-family:'Inter',sans-serif;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(120deg,var(--navy-900),var(--navy-700) 45%,var(--blue-500) 100%);
    background-size:220% 220%;
    animation:shimmerPan 10s ease-in-out infinite alternate;
    position:relative;overflow:hidden;
  }
  body::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.06), transparent 45%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
  }
  @keyframes shimmerPan{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  .card{
    position:relative;z-index:1;width:100%;max-width:380px;background:#fff;color:var(--ink);
    border-radius:16px;padding:34px 30px 30px;box-shadow:0 30px 70px rgba(0,0,0,.35);
    animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;text-align:center;}
  .brand-mark{
    width:54px;height:54px;border-radius:14px;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue-500),var(--navy-700));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;
    box-shadow:0 8px 20px rgba(59,125,191,.35);
    animation:floatY 3.6s ease-in-out infinite;
  }
  .brand h1{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;font-weight:700;color:var(--navy-900);}
  .brand p{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field input{
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;
    font-size:14px;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,125,191,.15);}

  .error-box{
    display:none;align-items:center;gap:8px;background:var(--bad-bg);color:var(--bad);
    font-size:12.5px;font-weight:500;padding:9px 11px;border-radius:8px;margin-bottom:14px;
  }
  .error-box.show{display:flex;animation:shake .4s ease;}
  .error-box svg{width:15px;height:15px;flex-shrink:0;}

  .btn{
    width:100%;padding:11px;border:none;border-radius:8px;background:var(--navy-700);color:#fff;
    font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .16s ease,transform .12s ease,box-shadow .16s ease;
  }
  .btn:hover{background:var(--navy-800);box-shadow:0 8px 20px rgba(15,35,64,.25);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{opacity:.7;cursor:not-allowed;transform:none;}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none;}
  .btn.loading .spinner{display:inline-block;}
  .btn.loading .btn-label{opacity:.85;}

  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-soft);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">TIK</div>
      <h1>Inventarisasi Aset TIK</h1>
      <p>Diskominfo Kabupaten Klaten</p>
    </div>

    <div class="error-box" id="error-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span id="error-text">Username atau password salah.</span>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-label">Masuk</span>
      </button>
    </form>

    <div class="foot">Akses terbatas untuk pegawai Diskominfo Klaten.</div>
  </div>

<script>
  const form = document.getElementById('login-form');
  const btn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error-box');
  const errorText = document.getElementById('error-text');

  function showError(msg){
    errorText.textContent = msg;
    errorBox.classList.remove('show');
    // restart animasi shake walau pesan errornya sama persis
    void errorBox.offsetWidth;
    errorBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(data.error || 'Gagal masuk. Coba lagi.');
        btn.disabled = false;
        btn.classList.remove('loading');
        return;
      }
      window.location.href = '/';
    } catch (err) {
      showError('Tidak bisa terhubung ke server. Periksa koneksi Anda.');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
